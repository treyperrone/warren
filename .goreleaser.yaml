version: 2

project_name: warren

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    # -trimpath keeps build-machine paths out of the binary: without it the release carried
    # 366 copies of the developer's home directory, and builds were not reproducible.
    flags:
      - -trimpath
    ldflags:
      # .Tag, not .Version — .Version strips the leading "v", and the version
      # `warren version` prints should match what `go install ...@v1.0.0`
      # asks for and what the release page lists.
      - -s -w -X github.com/treyperrone/warren/internal/buildinfo.version={{ .Tag }}

archives:
  # `formats` (plural), not the deprecated `format` — `goreleaser check` fails on the old
  # spelling and a future major removes it outright.
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # goreleaser's default shape, with the version in the name: warren_1.2.0_darwin_arm64.tar.gz.
    # A versionless name cannot distinguish last month's download from today's (the same
    # trap unstamped RC builds fell into), and scoop/winget manifests and Homebrew livecheck
    # expect the version there. Nothing links to a fixed archive URL: checksums.txt is
    # per-release and the tap formula is regenerated each release.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Specifying `files` replaces goreleaser's defaults (LICENSE*/README*/CHANGELOG*) rather
    # than adding to them, so those are relisted here. NOTICE is the one that matters: Apache-2.0
    # §4(d) is satisfied by shipping it with the distribution, and it is not a default.
    files:
      - LICENSE
      - NOTICE
      - THIRD-PARTY-NOTICES.md
      - README.md

checksum:
  name_template: checksums.txt

homebrew_casks:
  # The Homebrew package the tap serves. goreleaser regenerates Casks/warren.rb and commits
  # it to the tap on every tagged release, so it can never fall behind the way the hand-edited
  # formula did — the archive names, their sha256s, and the version all come from this build.
  #
  # A cask, not a formula: goreleaser deprecated `brews` (it only ever generated "hackyish
  # formulas" for prebuilt binaries) in favour of casks. `brew install warren` still resolves
  # to it; `brew install --cask warren` is the explicit form.
  - name: warren
    binaries: [warren]
    repository:
      owner: treyperrone
      name: homebrew-tap
      branch: main
      # A PAT with contents:write on treyperrone/homebrew-tap. The workflow's default
      # GITHUB_TOKEN is scoped to this repo alone and cannot push to the tap; this reads the
      # HOMEBREW_TAP_TOKEN Actions secret instead.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/treyperrone/warren"
    description: "Browse AWS accounts and connect to EC2 instances over SSM"
    # Only a real vX.Y.Z release moves the cask: "auto" skips the tap push on snapshots
    # (the workflow_dispatch dry run) and on pre-release tags.
    skip_upload: "auto"
    # The binary is not signed or notarised, so macOS quarantines it on a plain download.
    # Strip that on install — the same thing a `curl`/`scp` transfer avoids entirely — so
    # `brew install warren` gives a binary that just runs. Proper fix is an Apple Developer
    # ID and notarisation.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/warren"]
          end
