version: 2

project_name: warren

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    # -trimpath keeps build-machine paths out of the binary: without it the release carried
    # 366 copies of the developer's home directory, and builds were not reproducible.
    flags:
      - -trimpath
    ldflags:
      # .Tag, not .Version — .Version strips the leading "v", and the version
      # `warren version` prints should match what `go install ...@v1.0.0`
      # asks for and what the release page lists.
      - -s -w -X github.com/treyperrone/warren/internal/buildinfo.version={{ .Tag }}

archives:
  # `formats` (plural), not the deprecated `format` — `goreleaser check` fails on the old
  # spelling and a future major removes it outright.
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # goreleaser's default shape, with the version in the name: warren_1.2.0_darwin_arm64.tar.gz.
    # A versionless name cannot distinguish last month's download from today's (the same
    # trap unstamped RC builds fell into), and scoop/winget manifests and Homebrew livecheck
    # expect the version there. Nothing links to a fixed archive URL: checksums.txt is
    # per-release and the tap formula is regenerated each release.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Specifying `files` replaces goreleaser's defaults (LICENSE*/README*/CHANGELOG*) rather
    # than adding to them, so those are relisted here. NOTICE is the one that matters: Apache-2.0
    # §4(d) is satisfied by shipping it with the distribution, and it is not a default.
    files:
      - LICENSE
      - NOTICE
      - THIRD-PARTY-NOTICES.md
      - README.md

checksum:
  name_template: checksums.txt
