version: 2

project_name: ssm-tool

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w

archives:
  # `formats` (plural), not the deprecated `format` — `goreleaser check` fails on the old
  # spelling and a future major removes it outright.
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Keep this template stable: these names are what the v0.1.0/v0.1.2 assets already use,
    # so install instructions and checksums stay valid across releases.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
