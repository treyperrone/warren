name: plugin-update

# Watches aws/session-manager-plugin for new releases and opens a PR rebuilding the embedded
# binaries from the new tag.
#
# A PR, never a direct push: the diff is five ~10MB binaries, which nobody can review by eye, so
# the value is in a human seeing that a bump happened, what version it claims, and that CI passed
# on it. Auto-merging binary blobs into a tool that brokers credentials is not a trade worth making.
#
# This exists because embedding has a cost: AWS ships plugin fixes on their own schedule, and
# anyone running an older warren silently runs an older plugin. Without this, "embedded" quietly
# means "frozen at whenever someone last remembered".

on:
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: find the latest plugin release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The releases list, not the VERSION file in the repo: mainline's VERSION runs ahead of
          # what AWS has actually released (it read 1.3.0.0 while 1.2.835.0 was current), so it
          # would send us building unreleased code.
          latest="$(gh release list --repo aws/session-manager-plugin --limit 1 \
                     --json tagName --jq '.[0].tagName')"
          current="$(tr -d '[:space:]' < internal/plugin/version.txt)"
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "already on $current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$current -> $latest"
          fi

      - name: rebuild from the new tag
        if: steps.latest.outputs.changed == 'true'
        run: ./scripts/build-plugin.sh "${{ steps.latest.outputs.latest }}"

      # Proves the new binaries are the right architecture for each target before a human is asked
      # to look. A plugin built for the wrong arch fails only at exec time, on a user's machine —
      # exactly how linux/arm64 shipped broken once before.
      - name: verify each asset is built for its target
        if: steps.latest.outputs.changed == 'true'
        run: |
          set -euo pipefail
          check() {
            got="$(file -b "internal/plugin/assets/$1")"
            case "$got" in
              *"$2"*) echo "ok   $1" ;;
              *) echo "FAIL $1: expected '$2', got '$got'" >&2; exit 1 ;;
            esac
          }
          check session-manager-plugin-linux-amd64        "ELF 64-bit LSB executable, x86-64"
          check session-manager-plugin-linux-arm64        "ELF 64-bit LSB executable, ARM aarch64"
          check session-manager-plugin-darwin-amd64       "Mach-O 64-bit x86_64 executable"
          check session-manager-plugin-darwin-arm64       "Mach-O 64-bit arm64 executable"
          check session-manager-plugin-windows-amd64.exe  "PE32+ executable"

      - name: build and test warren against the new plugin
        if: steps.latest.outputs.changed == 'true'
        run: |
          go build ./...
          go test ./... -count=1

      - name: open a pull request
        if: steps.latest.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: plugin/${{ steps.latest.outputs.latest }}
          title: "plugin: rebuild from session-manager-plugin ${{ steps.latest.outputs.latest }}"
          commit-message: |
            plugin: rebuild from session-manager-plugin ${{ steps.latest.outputs.latest }}

            Built from the tagged source rather than AWS's published binaries, so what
            ships is a build of Apache-2.0 licensed code with a traceable origin.

            Previous: ${{ steps.latest.outputs.current }}
          body: |
            AWS released **${{ steps.latest.outputs.latest }}** (was `${{ steps.latest.outputs.current }}`).

            Rebuilt all five embedded plugins from that tag with `scripts/build-plugin.sh`.

            Automated checks that already passed here:

            - each asset is the correct binary format for its target
            - `go build ./...` and `go test ./...`

            Worth a look before merging:

            - the release notes at https://github.com/aws/session-manager-plugin/releases
            - whether `THIRD-PARTY-NOTICES.md` needs updating, if the plugin's own bundled
              dependencies changed in this release

            Note the version the binary reports about itself may not match the tag — AWS does not
            keep its in-tree version constant aligned with its release tags. The tag is what
            identifies provenance and is what `internal/plugin/version.txt` records.
